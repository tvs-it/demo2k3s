apiVersion: apps/v1
kind: Deployment
metadata:
  name: ${APP_NAME}-${TARGET_ENV}
  namespace: ${NAMESPACE}
  labels:
    app: ${APP_NAME}-${TARGET_ENV}
spec:
  replicas: ${REPLICAS}
  selector:
    matchLabels:
      app: ${APP_NAME}-${TARGET_ENV}
  template:
    metadata:
      labels:
        app: ${APP_NAME}-${TARGET_ENV}
    spec:
      imagePullSecrets:
        - name: gitlab-registry-pull
      containers:
        - name: ${APP_NAME}
          image: ${IMAGE}
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 2
            periodSeconds: 5
