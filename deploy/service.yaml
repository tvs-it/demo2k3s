apiVersion: v1
kind: Service
metadata:
  name: ${APP_NAME}-${TARGET_ENV}
  namespace: ${NAMESPACE}
  annotations:
    metallb.universe.tf/allow-shared-ip: "${APP_NAME}"
spec:
  type: LoadBalancer
  loadBalancerIP: ${APP_LB_IP}
  selector:
    app: ${APP_NAME}-${TARGET_ENV}
  ports:
    - port: ${SERVICE_PORT}
      targetPort: 80
